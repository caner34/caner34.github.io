<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="doc-title doc-desc">
  <title id="doc-title">Document intelligence pipeline</title>
  <desc id="doc-desc">PDF image or text fixture is validated, checked for quality, passed through OCR, classified, extracted, redacted for PII, validated, and returned as structured JSON or API response.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8f5}.box{fill:#fff;stroke:#d8ddd6;stroke-width:2}.soft{fill:#edf5f2;stroke:#bdd5cf;stroke-width:2}.text{fill:#18201d;font:600 17px Arial,Helvetica,sans-serif}.small{fill:#5d6862;font:500 13px Arial,Helvetica,sans-serif}.accent{fill:#0f766e}.line{stroke:#0f766e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="520" rx="18"/>
  <rect class="box" x="42" y="40" width="190" height="62" rx="8"/>
  <text class="text" x="137" y="66" text-anchor="middle">PDF / Image</text>
  <text class="small" x="137" y="86" text-anchor="middle">or text fixture</text>
  <path class="line" d="M232 71H292"/>
  <rect class="box" x="292" y="40" width="190" height="62" rx="8"/>
  <text class="text" x="387" y="76" text-anchor="middle">Input validation</text>
  <path class="line" d="M482 71H540"/>
  <rect class="box" x="540" y="40" width="178" height="62" rx="8"/>
  <text class="text" x="629" y="66" text-anchor="middle">Quality checks</text>
  <text class="small" x="629" y="86" text-anchor="middle">orientation / blur</text>
  <path class="line" d="M629 102V150"/>
  <rect class="box" x="540" y="150" width="178" height="62" rx="8"/>
  <text class="text" x="629" y="186" text-anchor="middle">OCR boundary</text>
  <path class="line" d="M540 181H482"/>
  <rect class="box" x="292" y="150" width="190" height="62" rx="8"/>
  <text class="text" x="387" y="176" text-anchor="middle">Document</text>
  <text class="text" x="387" y="196" text-anchor="middle">classification</text>
  <path class="line" d="M292 181H232"/>
  <rect class="box" x="42" y="150" width="190" height="62" rx="8"/>
  <text class="text" x="137" y="176" text-anchor="middle">Structured field</text>
  <text class="text" x="137" y="196" text-anchor="middle">extraction</text>
  <path class="line" d="M137 212V270"/>
  <rect class="box" x="42" y="270" width="190" height="62" rx="8"/>
  <text class="text" x="137" y="296" text-anchor="middle">PII detection</text>
  <text class="small" x="137" y="316" text-anchor="middle">and redaction</text>
  <path class="line" d="M232 301H292"/>
  <rect class="box" x="292" y="270" width="190" height="62" rx="8"/>
  <text class="text" x="387" y="296" text-anchor="middle">Schema + business</text>
  <text class="text" x="387" y="316" text-anchor="middle">validation</text>
  <path class="line" d="M482 301H540"/>
  <rect class="box" x="540" y="270" width="178" height="62" rx="8"/>
  <text class="text" x="629" y="296" text-anchor="middle">Structured JSON</text>
  <text class="small" x="629" y="316" text-anchor="middle">API response</text>
  <rect class="soft" x="208" y="390" width="344" height="58" rx="8"/>
  <text class="text" x="380" y="416" text-anchor="middle">Default path is deterministic</text>
  <text class="small" x="380" y="436" text-anchor="middle">Synthetic text fixtures stand in for OCR output.</text>
</svg>
